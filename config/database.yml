# MySQL. Versions 5.6.4 and up are supported.
#
# Install the MySQL driver
#   gem install mysql2
#
# Ensure the MySQL gem is defined in your Gemfile
#   gem "mysql2"

default: &default
  adapter: mysql2
  encoding: utf8mb4
  max_connections: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>
  username: root
  password: "mahima"
  socket: /var/run/mysqld/mysqld.sock

development:
  <<: *default
  database: clinic_app_development

test:
  <<: *default
  database: clinic_app_test

production:
  primary: &primary_production
    <<: *default
    database: clinic_app_production
    username: clinic_app
    password: <%= ENV["CLINIC_APP_DATABASE_PASSWORD"] %>

  cache:
    <<: *primary_production
    database: clinic_app_production_cache
    migrations_paths: db/cache_migrate

  queue:
    <<: *primary_production
    database: clinic_app_production_queue
    migrations_paths: db/queue_migrate

  cable:
    <<: *primary_production
    database: clinic_app_production_cable
    migrations_paths: db/cable_migrate